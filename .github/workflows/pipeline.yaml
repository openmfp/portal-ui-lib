name: ci
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: write # tag creation and version commits
  id-token: write # npm provenance when publishing

jobs:
  pipe:
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: false
    uses: openmfp/gha/.github/workflows/pipeline-node-module.yml@6c6f84d08f3365e47db624fa467b8ae5c25d0211 # main
    secrets:
      OPENMFP_PUBLISHER_PRIVATE_KEY: ${{ secrets.OPENMFP_PUBLISHER_PRIVATE_KEY }}
    with:
      publishFromDist: true
      environment: npmjs:@openmfp/portal-ui-lib
